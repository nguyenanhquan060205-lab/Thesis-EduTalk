# Dữ liệu của hệ thống nằm ở MongoDB Atlas và Firestore — cả hai đều là dịch vụ ngoài,
# cấu hình qua `backend/.env`, nên compose này KHÔNG dựng cơ sở dữ liệu nào.
#
# Từng có service `db: postgres:15-alpine` kèm `DATABASE_URL` truyền vào backend. Đã gỡ
# 20/09/2026: không một dòng code nào đọc `DATABASE_URL`, không có SQLAlchemy, không có
# migration. Nó chỉ làm `docker compose up` kéo thêm một container 240 MB rồi ngồi
# không, và tệ hơn là khiến người đọc tưởng dự án dùng Postgres.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edutalk_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: edutalk_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./web:/app
      - /app/node_modules
